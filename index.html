<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <title>Multi‑AI Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; direction: rtl; }
    textarea { width: 100%; height: 120px; }
    button { margin-top: 10px; padding: 8px 16px; }
    .answer { border: 1px solid #ccc; margin-top: 15px; padding: 10px; }
    .provider { font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>
  <h1>Multi‑AI Chat</h1>
  <textarea id="prompt" placeholder="כתוב כאן את הפרומפט שלך..."></textarea>
  <br />
  <button onclick="send()">שלח</button>

  <div id="results"></div>

  <script>
    async function send() {
      const prompt = document.getElementById("prompt").value;
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "טוען תשובות...";

      const res = await fetch("/api/multi", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });

      const data = await res.json();
      resultsDiv.innerHTML = "";

      data.forEach(a => {
        const div = document.createElement("div");
        div.className = "answer";
        div.innerHTML = `
          <div class="provider">${a.provider.toUpperCase()} (${a.model})</div>
          <div>${(a.answer || "").replace(/\n/g, "<br>")}</div>
        `;
        resultsDiv.appendChild(div);
      });
    }
  </script>
</body>
</html>
