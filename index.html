<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <title>Multi‑AI Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 20px auto; direction: rtl; }
    textarea { width: 100%; height: 120px; }
    button { margin-top: 10px; padding: 8px 16px; }
    .answers { margin-top: 20px; }
    .answer { border: 1px solid #ccc; margin-top: 15px; padding: 10px; border-radius: 6px; background: #fafafa; }
    .provider { font-weight: bold; margin-bottom: 5px; color: #333; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Multi‑AI Chat</h1>
  <textarea id="prompt" placeholder="כתוב כאן את הפרומפט שלך..."></textarea>
  <br />
  <button onclick="send()">שלח</button>

  <div id="status"></div>
  <div id="answers" class="answers"></div>

  <script>
    async function send() {
      const prompt = document.getElementById("prompt").value.trim();
      const status = document.getElementById("status");
      const answersDiv = document.getElementById("answers");

      if (!prompt) {
        alert("תכתוב משהו קודם");
        return;
      }

      status.textContent = "שולח למודלים...";
      answersDiv.innerHTML = "";

      try {
        const res = await fetch("/api/multi", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });

        const data = await res.json();
        status.textContent = "";

        data.forEach(a => {
          const div = document.createElement("div");
          div.className = "answer";
          div.innerHTML = `
            <div class="provider">${a.provider.toUpperCase()} (${a.model})</div>
            <div>${(a.answer || "").replace(/\n/g, "<br>")}</div>
          `;
          answersDiv.appendChild(div);
        });
      } catch (e) {
        status.textContent = "";
        answersDiv.innerHTML = `<div class="answer error">שגיאה כללית</div>`;
      }
    }
  </script>
</body>
</html>
